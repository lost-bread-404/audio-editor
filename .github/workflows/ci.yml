name: CI

# 什么时候跑
on:
  push:
    branches: [main]
  pull_request:            # 每个 PR 都跑，这才是真正的门禁
  schedule:
    - cron: '0 3 * * 1'    # 每周一凌晨 3 点跑一次，抓「环境变了」导致的失败

# 同一个分支连续 push 时，取消还在跑的旧任务，省时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1. 矩阵构建：3 个系统 x 2 个编译器，一次 push 全部验证
  # ---------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # 一个格子挂了，其他格子继续跑完
      # 用 include 而不是 os x cc 笛卡尔积：Windows 上 -DCMAKE_C_COMPILER
      # 会被 Visual Studio 生成器忽略，那样的格子名字写着 clang、实际跑
      # 的是 MSVC，比没有这个格子更糟。这里每一行都明确写出用什么。
      matrix:
        include:
          - {name: "Linux / gcc",     os: ubuntu-latest, cmake_args: "-DCMAKE_C_COMPILER=gcc"}
          - {name: "Linux / clang",   os: ubuntu-latest, cmake_args: "-DCMAKE_C_COMPILER=clang"}
          - {name: "macOS / clang",   os: macos-latest,  cmake_args: "-DCMAKE_C_COMPILER=clang"}
          - {name: "Windows / MSVC",  os: windows-latest, cmake_args: ""}
          - {name: "Windows / clang-cl", os: windows-latest, cmake_args: "-T ClangCL"}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release

  # ---------------------------------------------------------------
  # 2. Sanitizer：专门抓内存错误，必须单独一份构建
  # ---------------------------------------------------------------
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSOUND_SEG_ASAN=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        env:
          # halt_on_error=1: 一发现问题立刻退出并返回非 0
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --output-on-failure

  # ---------------------------------------------------------------
  # 3. 警告零容忍
  # ---------------------------------------------------------------
  warnings:
    name: -Werror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_C_FLAGS="-Werror"
      - run: cmake --build build -j
      # 同一份代码在 clang 下会报 gcc 不报的警告，反之亦然。两个都要跑。
      - run: cmake -S . -B build-clang -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS="-Werror"
      - run: cmake --build build-clang -j

  # ---------------------------------------------------------------
  # 4. 安装验证：别人真的能用吗
  # ---------------------------------------------------------------
  install:
    name: Install + find_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and install to a staging prefix
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$PWD/stage -DSOUND_SEG_BUILD_TESTS=OFF
          cmake --build build -j
          cmake --install build

      # 内部头文件绝不能被装出去，否则用户会开始依赖它，
      # 之后你就再也改不动内部结构了。
      - name: Internal headers must not be installed
        run: |
          if [ -e stage/include/sound_seg_extra.h ] || \
             [ -e stage/include/sound_seg/sound_seg_extra.h ]; then
            echo "internal header leaked into the install tree"; exit 1
          fi

      # 从一个完全独立的项目消费它，只通过 find_package。
      - name: Consume as an external project
        run: |
          cmake -S examples/consumer -B build-consumer \
                -DCMAKE_PREFIX_PATH=$PWD/stage
          cmake --build build-consumer -j
          ./build-consumer/app

  # ---------------------------------------------------------------
  # 5. 测试覆盖率：哪几行代码从来没被测到
  # ---------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Build instrumented
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="--coverage -O0"
          cmake --build build -j

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Collect report
        run: |
          # --ignore-errors unused: lcov 2.x 把「排除模式没匹配到任何文件」
          # 从警告升级成了错误。系统头文件本来就没被采集，所以 '/usr/*'
          # 永远匹配不到。这不是问题，但会让 job 以 25 退出。
          # --rc branch_coverage=1: 否则分支覆盖率一律显示 "no data found"，
          # 而分支正是错误处理路径所在的地方。
          lcov --capture --directory build --output-file coverage.info \
               --rc branch_coverage=1 \
               --ignore-errors mismatch,unused
          lcov --remove coverage.info '/usr/*' '*/tests/*' \
               --rc branch_coverage=1 \
               --ignore-errors unused \
               --output-file coverage.info
          lcov --list coverage.info --rc branch_coverage=1

      # 棘轮：只许升不许降。数字设在当前水平略下方，
      # 这样它挡的是「新代码没写测试」，而不是逼你今天补完所有测试。
      - name: Enforce minimum line coverage
        run: |
          MIN=65
          PCT=$(lcov --summary coverage.info 2>&1 \
                | awk -F'[ %]' '/lines/ {print int($4)}')
          echo "line coverage: ${PCT}%  (floor ${MIN}%)"
          if [ "$PCT" -lt "$MIN" ]; then
            echo "::error::coverage ${PCT}% is below the ${MIN}% floor"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info